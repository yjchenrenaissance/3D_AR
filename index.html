<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>iPhone AR Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #f5f5f5;
    }

    .hint {
      position: fixed;
      top: 70px;
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 16px;
      color: #333;
      z-index: 10;
    }

    button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 16px;
      border: none;
      background: #e10600;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }
  </style>
</head>

<body>

<div class="hint">
  先等 3D 模型出现，再点击下方按钮进入 AR
</div>

<model-viewer
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
  alt="Astronaut"
  camera-controls
  auto-rotate
  ar
  ar-modes="quick-look"
  shadow-intensity="1"
  exposure="1">

  <button slot="ar-button">
    用 iPhone 摄像头查看 AR
  </button>

</model-viewer>

</body>
</html>
